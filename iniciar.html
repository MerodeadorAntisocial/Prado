<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Martiniano E Diele Lucas Prado">
    <link rel="stylesheet" href="estiloregistro.css">
    <title>Prado - Iniciar Sesión</title>
</head>

<body>
    <header>
        <a href="index.html"><img src="imagenes/logo.png" alt="Logotipo"></a>

        <nav class="nav-header">
            <div class="contactanos">
                <a href="registrar.html">Crear Cuenta</a>
            </div>

            <div class="menu">
                <a href="canchas.html">Volver a Menú</a>
            </div>
        </nav>
    </header>

    <main class="contenedor">
        <div class="registro">
            <h2>INICIA SESIÓN EN TU CUENTA</h2>
        </div>
        
        <form action="#" method="POST">
            <h2>Sesión de Usuario</h2>

            <div class="campo">
                <label for="correo">Ingrese su Correo:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="contrasena">Ingrese su Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Escriba contraseña" required>
            </div>

            <div class="botones">
                <button type="submit" class="boton-enviar">Enviar</button>
            </div>
        </form>
    </main>

    <footer></footer>

</body>

</html>
