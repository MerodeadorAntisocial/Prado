<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="perfil.css">
    <title>Prado - Perfil</title>
</head>

<body>
    <header class="encabezado">
        <div class="nave">
            <img src="imagenes/logo.png" alt="Logotipo">
            <h1>Prado</h1> 
        </div>

        <div class="nave1">
            <a href="index.html">Inicio</a>
            <a href="turnos.html">Reservas</a>
            <a href="redes.html">Contactos</a>
        </div>
    </header>

    <main class="contenedor-perfil">
        <div class="tarjeta-perfil">
            <h2>Información Personal</h2>
            <form class="form-perfil" action="#" method="POST">
                <div class="grupo-form">
                    <label for="nombre">Nombre y apellido:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre y apellido" class="campo-form">
                </div>

                <div class="grupo-form">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" class="campo-form">
                </div>

                <div class="grupo-form">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" class="campo-form">
                </div>

                <button type="submit" class="boton-guardar">Guardar cambios</button>
            </form>
        </div>
    </main>

    <footer>
        <a href="#">Ayuda</a>
        <a href="contacto.html">Contacto</a>
        <a href="redes.html">Redes sociales</a>
    </footer>
</body>
</html>
